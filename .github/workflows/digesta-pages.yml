name: DIGESTA · Publicar en GitHub Pages
# Compila y prueba la PWA DIGESTA y la publica en GitHub Pages.
# Requiere activar Pages en Settings → Pages → Source: "GitHub Actions".
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['digesta/**', '.github/workflows/digesta-pages.yml']
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: digesta-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: digesta
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: digesta/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: digesta/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
