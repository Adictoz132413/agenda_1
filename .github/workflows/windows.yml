name: Validar y empaquetar Windows
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@1.99.0
      - run: npm ci
      - run: npm test
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml --no-default-features
      - run: npm run desktop:build -- --ci
      - uses: actions/upload-artifact@v4
        with:
          name: Montana-Agenda-Windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
